{% extends "base.html" %}
{% block title %}Teacher Login{% endblock %}
{% block body %}
<div class="entry-card">
  <div class="card card-pad">
    <h1 style="text-align:center;">Teacher Login</h1>
    <p class="muted small" style="text-align:center;" class="mb-24">CA Foundation Economics — Test Platform</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required autofocus placeholder="you@institute.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Log In</button>
    </form>
    <p class="small muted mt-16" style="text-align:center;">Demo: demo@institute.com / Demo@1234</p>
  </div>
</div>
{% endblock %}
