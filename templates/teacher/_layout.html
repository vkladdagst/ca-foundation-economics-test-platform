{% extends "base.html" %}
{% block body %}
<div class="app-shell">
  <div class="topbar">
    <a href="{{ url_for('teacher.dashboard') }}">CA Foundation Economics</a>
    <select onchange="if(this.value) window.location=this.value">
      <option value="">Menu</option>
      <option value="{{ url_for('teacher.dashboard') }}">Dashboard</option>
      <option value="{{ url_for('teacher.tests_list') }}">Tests</option>
      <option value="{{ url_for('teacher.bank_home') }}">Question Bank</option>
      <option value="{{ url_for('teacher.roster') }}">Students</option>
      <option value="{{ url_for('teacher.colleagues') }}">Colleagues</option>
      <option value="{{ url_for('teacher.settings') }}">Settings</option>
      <option value="{{ url_for('auth.logout') }}">Logout</option>
    </select>
  </div>
  <aside class="sidebar">
    <div class="sidebar-brand">CA Foundation<br>Economics
      <small>Test Platform</small>
    </div>
    <nav class="sidebar-nav">
      <a href="{{ url_for('teacher.dashboard') }}" class="{{ 'active' if active=='dashboard' }}">📊 Dashboard</a>
      <a href="{{ url_for('teacher.tests_list') }}" class="{{ 'active' if active=='tests' }}">📝 Tests</a>
      <a href="{{ url_for('teacher.bank_home') }}" class="{{ 'active' if active=='bank' }}">🗂️ Question Bank</a>
      <a href="{{ url_for('teacher.roster') }}" class="{{ 'active' if active=='students' }}">🎓 Students</a>
      <a href="{{ url_for('teacher.colleagues') }}" class="{{ 'active' if active=='colleagues' }}">👥 Colleagues</a>
      <a href="{{ url_for('teacher.settings') }}" class="{{ 'active' if active=='settings' }}">⚙️ Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="mb-8">{{ current_user.name }}</div>
      <a href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
  </aside>
  <main class="main-content">
    <div class="container">
      {% block teacher_body %}{% endblock %}
    </div>
  </main>
</div>
{% endblock %}
