name: Keep Render app awake

# Render's free web service spins down after ~15 minutes with no traffic,
# costing the next visitor a 30-60s cold-start wait. Pinging the homepage
# every 10 minutes keeps it comfortably below that threshold. This alone
# costs nothing on GitHub's side (each run is a few seconds) and needs no
# third-party account. Run it manually any time too, via workflow_dispatch.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://ca-foundation-economics-test-platform.onrender.com/)
          echo "Response: $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::warning::Site responded with HTTP $code"
          fi
