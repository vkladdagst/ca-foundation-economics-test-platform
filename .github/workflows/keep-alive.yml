name: Keep Render app awake + alert on failure

# Two jobs in one: keeps the free web service from spinning down (pinging
# every 10 minutes, comfortably under Render's ~15-minute inactivity
# threshold), AND actually verifies the database is reachable by hitting
# /healthz (a real "SELECT 1" query) instead of just the homepage.
#
# Critically, this workflow FAILS (non-zero exit) if that check doesn't
# come back healthy -- GitHub automatically emails the repo owner whenever
# a scheduled workflow run fails, so an outage (expired database, crash,
# anything) surfaces here within ~10 minutes instead of only being noticed
# when someone tries to use the app. This is exactly what would have
# caught the Postgres-expiry incident early.
#
# Two attempts, not one: if the app was already asleep, this very ping is
# what wakes it up, and Render's free-tier cold start can take longer than
# a single generous timeout. Without a retry, every cold start reads as a
# false "outage" and emails the owner even though the app was actually
# fine (it just needed a few more seconds) -- that's what was flooding the
# inbox. Only fail (and alert) if the SECOND attempt, after the app has
# had time to fully wake up, also fails.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check /healthz (pings the app awake AND verifies the database)
        run: |
          url="https://ca-foundation-economics-test-platform.onrender.com/healthz"

          check() {
            curl -sS --max-time 75 -w "\n%{http_code}" "$url" || echo -e "\n000"
          }

          response=$(check)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$code" != "200" ]; then
            echo "First attempt returned HTTP $code (likely a cold start still waking up) -- retrying once after a short wait."
            echo "$body"
            sleep 20
            response=$(check)
            code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
          fi

          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed with HTTP $code on both attempts -- see body above. This run failing means GitHub will email you about it."
            exit 1
          fi
