# Render Blueprint — defines the web service and database together so the
# whole app can be created with one "New Blueprint" action in the Render
# dashboard, instead of configuring each piece by hand.
#
# Usage: Render Dashboard -> New -> Blueprint -> select this repo -> Apply.
databases:
  - name: econ-test-db
    plan: free

services:
  - type: web
    name: ca-foundation-economics-test-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Threaded workers so multiple students hitting the app at once (e.g.
    # everyone opening the test link within the same minute) are served
    # concurrently instead of queued one-at-a-time behind a single sync
    # worker. One process (kind to the free tier's limited RAM) with 4
    # threads -- most of each request's time is waiting on the database,
    # which threads handle well despite the GIL.
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --timeout 60 run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: econ-test-db
          property: connectionString

      # --- Web Push ---
      # Public values come from the blueprint; the private key is a secret
      # you add once by hand in the dashboard (Environment tab). sync:false
      # means later blueprint syncs leave your hand-entered value alone.
      - key: VAPID_PUBLIC_KEY
        value: BH8BxYUIKguvuGWmU9oqAI5HTHWu89p1ag7AfF6b4yKoXp9adx9FzIbmshup61_tkVWSAhX_3NfApZDbkoMWfOs
      - key: VAPID_SUBJECT
        value: mailto:smacaoutreach@gmail.com
      - key: VAPID_PRIVATE_KEY
        sync: false

      # --- Email / SMTP (Gmail) ---
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USER
        value: smacaoutreach@gmail.com
      - key: SMTP_FROM
        value: smacaoutreach@gmail.com
      - key: SMTP_PASSWORD
        sync: false   # your 16-char Gmail App Password — add by hand in the dashboard
