# Render Blueprint — defines the web service and database together so the
# whole app can be created with one "New Blueprint" action in the Render
# dashboard, instead of configuring each piece by hand.
#
# Usage: Render Dashboard -> New -> Blueprint -> select this repo -> Apply.
databases:
  - name: econ-test-db
    plan: free

services:
  - type: web
    name: ca-foundation-economics-test-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: econ-test-db
          property: connectionString

      # --- Web Push (public values; private key is entered in the dashboard) ---
      - key: VAPID_PUBLIC_KEY
        value: BH8BxYUIKguvuGWmU9oqAI5HTHWu89p1ag7AfF6b4yKoXp9adx9FzIbmshup61_tkVWSAhX_3NfApZDbkoMWfOs
      - key: VAPID_SUBJECT
        value: mailto:smacaoutreach@gmail.com
      - key: VAPID_PRIVATE_KEY
        sync: false   # secret — Render will prompt you for this value

